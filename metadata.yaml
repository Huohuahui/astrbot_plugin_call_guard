name: astrbot_plugin_call_guard
display_name: 单人静默防护 Call Guard
short_desc: 有人狂call机器人？自动把他拉进静默期，按概率放行回复，精准限人不误伤全群
desc: "单人刷屏静默防护 —— 不用再靠全局限速误伤所有群友。call_guard 只针对刷屏的那一个人：检测到他频繁 call 机器人（艾特机器人 / 引用回复机器人消息），窗口内超过阈值就把他拉进静默期；静默期内每次 call 按 reply_probability（0-1）概率放行，其余消息直接丢弃、不消耗 LLM token。管理员默认豁免；/ 开头的指令不计数也不拦截（不影响群分析、天气等指令）；只对群聊生效，私聊不受影响；状态持久化到插件数据目录，重启不丢；零第三方依赖。典型场景：群友无聊时反复艾特机器人，用 0.2 的概率偶尔回一下，既不失礼也不烧 token。"
version: 1.0.3
author: Huohuahui
repo: https://github.com/Huohuahui/astrbot_plugin_call_guard
astrbot_version: ">=4.9.0"
support_platforms:
  - aiocqhttp
social_link: https://github.com/Huohuahui
tags:
